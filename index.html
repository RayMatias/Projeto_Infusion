<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StoryCompass-Home</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <header class="header grid-cols-12">
            <div class="header__logo-container">
                <img class="header__logo" src="./assets/Logo (2).png" alt="Imagem da logo do site">
            </div>
            <nav class="nav">
                <div class="nav__button-container">
                   <button class="nav__button" aria-label="Ícone Menu" aria-haspopup="tree" aria-controls="nav__menu-controls" aria-expanded="false" type="button"><i class="fa-solid fa-bars"></i></button>
                </div>
                <ul class="nav__menu" id="nav__menu-controls">
                    <li class="nav__item"><a class="nav__link" href="index.html">Home</a></li>
                    <li class="nav__item"><a class="nav__link" href="#">Categorias</a></li>
                    <li class="nav__item"><a class="nav__link" href="#">Destaques</a></li>
                    <li class="nav__item"><a class="nav__link" href="#">Lançamentos</a></li>
                    <li class="nav__item"><a class="nav__link" href="#">E-books Grátis</a></li>
                    <li class="nav__item"><a class="nav__link" href="#">Contato</a></li>
                </ul>
            </nav>
        </header>
        <main class="main grid-cols-12">
            <div class="hero">
                <div class="hero-container grid-cols-12">
                    <div class="hero__search-container col-10">
                        <input type="text" class="hero__search" placeholder="Pesquisar livros, autores, gêneros....">
                        <button type="button" class="hero__btn__search"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>
                    <div class="hero__title-container col-10">
                        <h1 class="hero__title">Descrubra sua próxima leitura!</h1>
                    </div>
                    <div class="hero__book col-10 grid-cols-8">
                        <div class="hero__book-container">
                            <img class="hero__img" src="./assets/Livro-O-Oceano-No-Fim-Do-Caminho.png" alt="Imagem do livro ">
                        </div>
                        <div class="hero__description-container">
                            <div class="hero__title__book-container">
                                <h2 class="hero__title__secondary">O oceano no fim do caminho</h2>
                            </div>
                            <div class="hero__author__book-container">
                                <p class="hero__subtitle">Nell gaimon</p>
                                <i class="fa-solid fa-star"></i>
                                <p class="hero__subtitle">4.8</p>
                            </div>
                            <div class="hero__sumary__book-container">
                                <p class="hero__sumary">Ao retornar à sua cidade natal, um homem revive memórias de infância marcadas por magia e uma amizade transformadora.</p>
                            </div>
                            <div class="hero__details__book-container">
                                <button class="hero__btn__details">Ver detalhes</button>
                            </div>
                        </div>
                    </div>
                </div> 
            </div>
        </main>
        <script src="./js/script.js"></script>
    </body>
</html>
